apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: Flow
spec:
  displayName: Flow
  author:
    name: Akagi_Zen
    website: https://github.com/fhfzfy1231
  description: 一款基于 Ethereal 二次开发的个人使用主题。
  logo: /themes/Flow/assets/images/favicon-light-192.png
  homepage: https://github.com/fhfzfy1231/Halo-Theme-Ethereal#readme
  repo: https://github.com/fhfzfy1231/Halo-Theme-Ethereal
  issues: https://github.com/fhfzfy1231/Halo-Theme-Ethereal/issues
  customTemplates:
    page:
      - name: "朋友圈"
        description: "朋友圈动态页面"
        file: "friends.html"
      - name: "心愿便签"
        description: "心愿墙 + 树洞便签墙页面（需安装心愿便签插件）"
        file: "wishes.html"
      - name: "时间轴"
        description: "个人成长历程时间轴页面（在主题设置的「时间轴」Tab 中配置数据）"
        file: "timeline.html"
      - name: "技能"
        description: "个人技能展示页面（在主题设置的「技能」Tab 中配置数据）"
        file: "skills.html"
  settingName: "Flow-setting"
  configMapName: "Flow-configMap"
  version: "1.2.1"
  requires: ">=2.25.0"
  license:
    - name: "MIT"
      url: "https://github.com/fhfzfy1231/Halo-Theme-Ethereal/blob/main/LICENSE"
